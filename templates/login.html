<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica 4 - Login (demo vulnerable)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .caja {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            width: 320px;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 14px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #2d6cdf;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .mensaje {
            margin-top: 16px;
            padding: 10px;
            border-radius: 4px;
            background: #eee;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Práctica 4: Sistema de acceso</h1>
        <form method="POST" action="/login">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="off">

            <label for="password">Contraseña</label>
            <input type="text" id="password" name="password" autocomplete="off">

            <button type="submit">Ingresar</button>
        </form>

        {% if mensaje %}
        <div class="mensaje">{{ mensaje }}</div>
        {% endif %}
    </div>
</body>
</html>
